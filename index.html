<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title> UNY 平面圖面積/長度計算器 - OPS TEAM </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; background: #f0f2f5; display: flex; height: 100vh; overflow: hidden; touch-action: none; /* 禁止瀏覽器預設觸控行為 */ }
        
        /* 側邊欄 */
        #sidebar { width: 220px; background: #2c3e50; color: white; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #1a252f; }
        #logo-container { padding: 15px; background: #ffffff; text-align: center; border-bottom: 2px solid #3498db; }
        #company-logo { max-width: 100%; max-height: 80px; object-fit: contain; }
        .sidebar-header { padding: 12px; background: #1a252f; font-weight: bold; text-align: center; font-size: 14px; color: #bdc3c7; }
        .preset-item { padding: 12px 15px; border-bottom: 1px solid #34495e; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 0.9em; }
        .preset-item:hover { background: #34495e; }
        .preset-item.active { background: #3498db; }
        .preset-num { opacity: 0.5; width: 20px; }

        /* 主內容區 */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
        .panel { background: white; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* 工具列佈局 */
        .row-yellow { background: #fffde7; padding: 10px 15px; border-bottom: 1px solid #f0e68c; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .row-tools { padding: 10px 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        label { font-weight: bold; font-size: 13px; white-space: nowrap; }
        select, input[type=file] { padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        .btn { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-tool { background: #f8f9fa; border: 1px solid #ddd; color: #333; }
        .btn-tool.active { background: #007bff; color: white; border-color: #0056b3; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:disabled { background: #eee; color: #aaa; cursor: not-allowed; border: 1px solid #ddd; }
        
        .btn-success { background: #28a745; color: white; font-weight: bold; box-shadow: 0 2px 4px rgba(40,167,69,0.2); }
        .btn-success:hover { background: #218838; }
        .btn-success:disabled { background: #c3e6cb; cursor: not-allowed; opacity: 0.6; }

        .divider { width: 1px; height: 20px; background: #ddd; margin: 0 5px; }
        
        #canvas-wrapper { flex-grow: 1; position: relative; background: #555; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .status-bar { display: flex; justify-content: space-between; padding: 8px 20px; font-weight: bold; background: white; border-top: 1px solid #ddd; font-size: 14px; }
        .result-text { color: #d9534f; font-size: 1.1em; }
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); color: white; justify-content: center; align-items: center; z-index: 999; }

        @media print {
            body { background: white; display: block; height: auto; overflow: visible; }
            #sidebar, .panel, .status-bar, #loader { display: none !important; }
            #main-content { height: auto; width: 100%; display: block; }
            #canvas-wrapper { position: static; width: 100%; height: auto; background: white; overflow: visible; }
            canvas { width: 100%; height: auto; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>

<div id="loader">處理中，請稍候...</div>

<div id="sidebar">
    <div id="logo-container">
        <img id="company-logo" src="Drawing/apita-uny-logo.png" alt="Logo">
    </div>
    <div class="sidebar-header">預設平面圖清單</div>
    <div id="presetList"></div>
</div>

<div id="main-content">
    <div class="panel">
        <div class="row-yellow">
            <label>其他平面圖上傳:</label>
            <input type="file" id="fileInput" accept="image/jpeg, image/png, application/pdf">
            <div class="divider"></div>
            <label>圖紙尺寸:</label>
            <select id="paperSize">
                <option value="A0">A0</option><option value="A1">A1</option><option value="A2">A2</option><option value="A3">A3</option><option value="A4" selected>A4</option>
            </select>
            <label>比例 1:</label>
            <select id="scaleRatio">
                <option value="50">50</option><option value="75">75</option><option value="100">100</option><option value="150">150</option><option value="200">200</option><option value="250" selected>250</option><option value="300">300</option><option value="350">350</option><option value="400">400</option><option value="500">500</option>
            </select>
            <button id="btnApplyScale" class="btn btn-primary" disabled><i class="fas fa-sync"></i> 確認比例</button>
            <div class="divider"></div>
            <button id="btnCalibrate" class="btn btn-warning"><i class="fas fa-drafting-compass"></i> 手動比例校對</button>
        </div>

        <div class="row-tools">
            <button id="btnPan" class="btn btn-tool active"><i class="fas fa-arrows-alt"></i> 平移</button>
            <button id="btnMeasureArea" class="btn btn-tool"><i class="fas fa-draw-polygon"></i> 測量面積平方呎</button>
            <button id="btnMeasureLength" class="btn btn-tool"><i class="fas fa-ruler-combined"></i> 測量長度</button>
            <div class="divider"></div>
            <button id="btnUndo" class="btn btn-tool"><i class="fas fa-undo"></i> 撤銷 (Ctrl+Z)</button>
            <button id="btnClear" class="btn btn-tool"><i class="fas fa-trash-alt"></i> 清除</button>
            <div class="divider"></div>
            <button id="btnZoomIn" class="btn btn-tool"><i class="fas fa-search-plus"></i></button>
            <button id="btnZoomOut" class="btn btn-tool"><i class="fas fa-search-minus"></i></button>
            <button id="btnSave" class="btn btn-success" disabled><i class="fas fa-download"></i> 儲存 JPEG</button>
        </div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="myCanvas"></canvas>
    </div>

    <div class="status-bar">
        <div id="guideText">提示：iPad 上單指繪圖/平移，雙指縮放。</div>
        <div>結果: <span id="areaResult" class="result-text">0</span></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const PRESETS = [
        { name: "Apita-G/F-Layout", url: "Drawing/Apita-GF-Layoutplan_250_A3.jpg", paper: "A3", scale: 250 },
        { name: "Apita-B/F-Layout", url: "Drawing/Apita-BF-Layoutplan_400_A3.jpg", paper: "A3", scale: 400 },
        { name: "UNY-LokFu-Layout", url: "Drawing/UNY-LokFu-Layoutplan_500_A3.jpg", paper: "A3", scale: 500 },
        { name: "UNY-TKO-Layout", url: "Drawing/UNY-TKO-Layoutplan_300_A3.jpg", paper: "A3", scale: 300 },
        { name: "UNY-YL-Layout", url: "Drawing/UNY-YL-Layoutplan_200_A3.jpg", paper: "A3", scale: 200 },
    ];

    const wrapper = document.getElementById('canvas-wrapper');
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    const loader = document.getElementById('loader');
    
    let img = new Image();
    let imgLoaded = false;
    let ppm = 0, view = { x: 0, y: 0, zoom: 1 };
    let currentTool = 'pan', points = [], mousePos = { x: 0, y: 0 }; 
    let isDragging = false, lastMouse = { x: 0, y: 0 }, isShiftPressed = false, finalValueText = ""; 
    
    // 觸控專用變數
    let lastTouchDist = 0;
    let lastTouchCenter = null;
    let touchStartPos = { x: 0, y: 0 };

    const PAPER_SIZES = { 'A0':841, 'A1':594, 'A2':420, 'A3':297, 'A4':210 };

    // 側邊欄渲染
    const presetList = document.getElementById('presetList');
    for(let i=0; i<5; i++) {
        const item = PRESETS[i] || { name: `預設圖紙 ${String(i+1).padStart(2,'0')}`, url: "" };
        const div = document.createElement('div');
        div.className = 'preset-item';
        div.innerHTML = `<span class="preset-num">${String(i+1).padStart(2, '0')}</span> <span>${item.name}</span>`;
        if (item.url) {
            div.onclick = () => loadPreset(div, item);
        } else {
            div.style.opacity = "0.5";
            div.style.cursor = "default";
        }
        presetList.appendChild(div);
    }

    function setScaleControlsLock(isLocked) {
        document.getElementById('paperSize').disabled = isLocked;
        document.getElementById('scaleRatio').disabled = isLocked;
        document.getElementById('btnApplyScale').disabled = isLocked;
        document.getElementById('btnCalibrate').disabled = isLocked;
    }

    function loadPreset(element, data) {
        document.querySelectorAll('.preset-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        setScaleControlsLock(true);
        document.getElementById('paperSize').value = data.paper || 'A4';
        document.getElementById('scaleRatio').value = data.scale || 250;
        
        imgLoaded = false; 
        loader.style.display = 'flex';
        img.removeAttribute('crossOrigin');

        if (data.url.toLowerCase().endsWith('.pdf')) {
            loadPdfFromUrl(data.url);
        } else {
            fetch(data.url)
                .then(r => { if(!r.ok) throw new Error(r.status); return r.blob(); })
                .then(b => { img.onload = () => { imgLoaded = true; loader.style.display='none'; finishImageLoad(); }; img.src = URL.createObjectURL(b); })
                .catch(e => {
                    img.onload = () => { imgLoaded = true; loader.style.display='none'; finishImageLoad(); };
                    img.onerror = () => { loader.style.display='none'; alert("圖片載入失敗: "+data.url); };
                    img.src = data.url;
                });
        }
    }

    async function loadPdfFromUrl(url) {
        try {
            const loadingTask = pdfjsLib.getDocument(url);
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 2.0 });
            const offCanvas = document.createElement('canvas');
            offCanvas.height = viewport.height; offCanvas.width = viewport.width;
            await page.render({ canvasContext: offCanvas.getContext('2d'), viewport: viewport }).promise;
            img.onload = () => { imgLoaded = true; loader.style.display = 'none'; finishImageLoad(); };
            img.src = offCanvas.toDataURL('image/jpeg');
        } catch (error) {
            loader.style.display = 'none';
            alert("PDF 載入失敗！\n注意：本地模式(file://)可能限制 PDF 讀取，請使用伺服器。");
        }
    }

    document.getElementById('fileInput').onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        setScaleControlsLock(false);
        document.querySelectorAll('.preset-item').forEach(el => el.classList.remove('active'));
        loader.style.display = 'flex'; imgLoaded = false;
        img.removeAttribute('crossOrigin');

        if (file.type === 'application/pdf') {
            const reader = new FileReader();
            reader.onload = async function() {
                try {
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const offCanvas = document.createElement('canvas');
                    offCanvas.height = viewport.height; offCanvas.width = viewport.width;
                    await page.render({ canvasContext: offCanvas.getContext('2d'), viewport: viewport }).promise;
                    img.onload = () => { imgLoaded = true; loader.style.display = 'none'; finishImageLoad(); };
                    img.src = offCanvas.toDataURL('image/jpeg');
                } catch (err) { loader.style.display = 'none'; alert("PDF 錯誤: " + err.message); }
            };
            reader.readAsArrayBuffer(file);
        } else {
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => { imgLoaded = true; loader.style.display = 'none'; finishImageLoad(); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    };

    function finishImageLoad() { applyScaleSettings(); resetView(); draw(); }

    function applyScaleSettings() {
        const paperW = PAPER_SIZES[document.getElementById('paperSize').value];
        const ratio = parseInt(document.getElementById('scaleRatio').value);
        const actualPaperW = (img.width > img.height) ? Math.max(paperW, (paperW === 210 ? 297 : paperW*1.41)) : Math.min(paperW, (paperW === 210 ? 210 : paperW/1.41));
        ppm = img.width / ((actualPaperW / 1000) * ratio);
    }

    function screenToCanvas(sx, sy) { return { x: (sx - view.x) / view.zoom, y: (sy - view.y) / view.zoom }; }

    function render(targetCtx, w, h, isExport = false) {
        targetCtx.clearRect(0, 0, w, h);
        if (!imgLoaded) return;
        targetCtx.save();
        targetCtx.translate(view.x, view.y); targetCtx.scale(view.zoom, view.zoom);
        targetCtx.drawImage(img, 0, 0);
        if (points.length > 0) {
            targetCtx.beginPath(); targetCtx.moveTo(points[0].x, points[0].y);
            points.forEach(p => targetCtx.lineTo(p.x, p.y));
            if (!isExport && ['area', 'length', 'calibrate'].includes(currentTool)) {
                let lp = points[points.length-1]; let tp = getConstrainedPos(lp, mousePos);
                targetCtx.setLineDash([5/view.zoom, 5/view.zoom]);
                targetCtx.strokeStyle = currentTool === 'calibrate' ? '#ffc107' : 'red';
                targetCtx.lineTo(tp.x, tp.y); targetCtx.stroke(); targetCtx.setLineDash([]);
            } else if (points.length > 2 && finalValueText.includes("sq.ft")) {
                targetCtx.closePath(); targetCtx.fillStyle = 'rgba(220,53,69,0.3)'; targetCtx.fill();
            }
            targetCtx.strokeStyle = '#dc3545'; targetCtx.lineWidth = 2/view.zoom; targetCtx.stroke();
            points.forEach(p => {
                targetCtx.beginPath(); targetCtx.arc(p.x, p.y, 4/view.zoom, 0, Math.PI*2);
                targetCtx.fillStyle = 'white'; targetCtx.fill(); targetCtx.stroke();
            });
            if (finalValueText !== "" && (isExport || currentTool === 'pan')) drawLabel(targetCtx, view.zoom);
        }
        targetCtx.restore();
    }

    function drawLabel(targetCtx, currentZoom) {
        let cx = 0, cy = 0; points.forEach(p => { cx += p.x; cy += p.y; });
        cx /= points.length; cy /= points.length;
        const fontSize = 18 / currentZoom;
        targetCtx.font = `bold ${fontSize}px Arial`; targetCtx.textAlign = "center";
        targetCtx.strokeStyle = "white"; targetCtx.lineWidth = 4 / currentZoom;
        targetCtx.strokeText(finalValueText, cx, cy);
        targetCtx.fillStyle = "red"; targetCtx.fillText(finalValueText, cx, cy);
    }

    function draw() { render(ctx, canvas.width, canvas.height, false); }

    function getConstrainedPos(start, end) {
        if (!isShiftPressed || !start) return end;
        let dx = end.x - start.x, dy = end.y - start.y;
        let angle = Math.atan2(dy, dx), dist = Math.sqrt(dx * dx + dy * dy);
        let snappedAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
        return { x: start.x + dist * Math.cos(snappedAngle), y: start.y + dist * Math.sin(snappedAngle) };
    }

    // --- 增加觸控事件監聽 (Touch Support) ---
    wrapper.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            // 單指觸控：記錄位置以檢測是否為點擊 (Tap)
            const rect = canvas.getBoundingClientRect();
            const t = e.touches[0];
            lastMouse = { x: t.clientX - rect.left, y: t.clientY - rect.top };
            touchStartPos = { x: t.clientX, y: t.clientY };
            isDragging = true;
        } else if (e.touches.length === 2) {
            // 雙指觸控：準備縮放與平移
            isDragging = false;
            const p1 = e.touches[0], p2 = e.touches[1];
            lastTouchDist = Math.hypot(p2.clientX - p1.clientX, p2.clientY - p1.clientY);
            lastTouchCenter = { x: (p1.clientX + p2.clientX) / 2, y: (p1.clientY + p2.clientY) / 2 };
        }
    }, { passive: false });

    wrapper.addEventListener('touchmove', (e) => {
        e.preventDefault(); // 防止滾動頁面
        const rect = canvas.getBoundingClientRect();

        if (e.touches.length === 1 && isDragging && currentTool === 'pan') {
             // 單指平移
             const t = e.touches[0];
             const mx = t.clientX - rect.left;
             const my = t.clientY - rect.top;
             view.x += mx - lastMouse.x;
             view.y += my - lastMouse.y;
             lastMouse = { x: mx, y: my };
             draw();
        } else if (e.touches.length === 2) {
             // 雙指操作 (縮放 + 平移)
             const p1 = e.touches[0], p2 = e.touches[1];
             const dist = Math.hypot(p2.clientX - p1.clientX, p2.clientY - p1.clientY);
             const center = { x: (p1.clientX + p2.clientX) / 2, y: (p1.clientY + p2.clientY) / 2 };

             if (lastTouchDist > 0) {
                 const scale = dist / lastTouchDist;
                 const cx = center.x - rect.left;
                 const cy = center.y - rect.top;
                 const mouseBefore = screenToCanvas(cx, cy);
                 view.zoom *= scale;
                 view.x = cx - mouseBefore.x * view.zoom;
                 view.y = cy - mouseBefore.y * view.zoom;
             }
             if (lastTouchCenter) {
                 view.x += center.x - lastTouchCenter.x;
                 view.y += center.y - lastTouchCenter.y;
             }
             lastTouchDist = dist;
             lastTouchCenter = center;
             draw();
        }
    }, { passive: false });

    wrapper.addEventListener('touchend', (e) => {
        e.preventDefault(); // 防止觸發滑鼠事件
        // 檢測是否為「輕點 (Tap)」
        if (e.changedTouches.length === 1 && e.touches.length === 0 && currentTool !== 'pan') {
            const t = e.changedTouches[0];
            const dist = Math.hypot(t.clientX - touchStartPos.x, t.clientY - touchStartPos.y);
            
            // 如果手指移動距離小於 10px，視為點擊，執行加點邏輯
            if (dist < 10) {
                const rect = canvas.getBoundingClientRect();
                handleInputPoint(t.clientX - rect.left, t.clientY - rect.top);
            }
        }
        isDragging = false;
        lastTouchDist = 0;
        lastTouchCenter = null;
    });

    // --- 滑鼠事件 ---
    wrapper.addEventListener('mousedown', e => {
        const rect = canvas.getBoundingClientRect();
        const ox = e.clientX - rect.left, oy = e.clientY - rect.top;
        if (currentTool === 'pan') { isDragging = true; lastMouse = { x: ox, y: oy }; } 
        else {
            if (e.button === 2) { closeMeasurement(); return; }
            handleInputPoint(ox, oy);
        }
    });

    // 統一處理加點邏輯 (滑鼠點擊 與 觸控Tap 共用)
    function handleInputPoint(ox, oy) {
        let clickPos = screenToCanvas(ox, oy);
        if (points.length > 0) clickPos = getConstrainedPos(points[points.length-1], clickPos);
        
        // 智能封閉邏輯
        if (currentTool === 'area' && points.length >= 3) {
            const threshold = 17 / view.zoom; 
            for (let p of points) {
                if (Math.sqrt(Math.pow(clickPos.x - p.x, 2) + Math.pow(clickPos.y - p.y, 2)) < threshold) { 
                    closeMeasurement(); return; 
                }
            }
        }
        points.push(clickPos);
        if (currentTool === 'calibrate' && points.length === 2) setTimeout(runManualCalibration, 100);
        draw();
    }

    function runManualCalibration() {
        let p1 = points[0], p2 = points[1];
        let pxDist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
        let realCM = prompt("請輸入實際長度 (cm):", "100");
        if (realCM && !isNaN(realCM)) { ppm = pxDist / (parseFloat(realCM) / 100); alert("比例校對完成！"); }
        points = []; switchTool('pan');
    }

    wrapper.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        const ox = e.clientX - rect.left, oy = e.clientY - rect.top;
        mousePos = screenToCanvas(ox, oy);
        if (isDragging && currentTool === 'pan') {
            view.x += ox - lastMouse.x; view.y += oy - lastMouse.y;
            lastMouse = { x: ox, y: oy };
        }
        draw();
    });

    window.addEventListener('mouseup', () => isDragging = false);
    wrapper.addEventListener('wheel', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const ox = e.clientX - rect.left, oy = e.clientY - rect.top;
        const mouseBefore = screenToCanvas(ox, oy);
        view.zoom *= (e.deltaY > 0 ? 0.9 : 1.1);
        view.x = ox - mouseBefore.x * view.zoom; view.y = oy - mouseBefore.y * view.zoom;
        draw();
    }, { passive: false });

    function closeMeasurement() {
        if (points.length < 2) return;
        if (currentTool === 'area' && points.length >= 3) {
            let areaPx = 0;
            for (let i = 0, j = points.length - 1; i < points.length; j = i++) areaPx += (points[j].x + points[i].x) * (points[j].y - points[i].y);
            finalValueText = ((Math.abs(areaPx / 2) / (ppm * ppm)) * 10.7639).toFixed(2) + " sq.ft";
        } else if (currentTool === 'length') {
            let totalPx = 0;
            for (let i = 0; i < points.length - 1; i++) totalPx += Math.sqrt(Math.pow(points[i+1].x-points[i].x,2) + Math.pow(points[i+1].y-points[i].y,2));
            finalValueText = ((totalPx / ppm) * 100).toFixed(2) + " cm";
        }
        document.getElementById('areaResult').innerText = finalValueText;
        switchTool('pan'); document.getElementById('btnSave').disabled = false; draw();
    }

    function switchTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
        const btnId = 'btn' + tool.charAt(0).toUpperCase() + tool.slice(1);
        if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
        wrapper.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
        if (tool !== 'pan') { points = []; finalValueText = ""; }
        draw();
    }

    function resetView() {
        const s = Math.min(wrapper.clientWidth/img.width, wrapper.clientHeight/img.height) * 0.95;
        view = { zoom: s, x: (wrapper.clientWidth-img.width*s)/2, y: (wrapper.clientHeight-img.height*s)/2 };
    }

    function undoLastPoint() { if (points.length > 0) { points.pop(); finalValueText = ""; draw(); } }

    window.addEventListener('keydown', e => {
        if (e.key === 'Shift') isShiftPressed = true;
        if (e.key === ' ') { e.preventDefault(); switchTool('pan'); }
        if (e.key === 'Enter') closeMeasurement();
        if (e.key === 'Backspace' || (e.ctrlKey && e.key === 'z')) { e.preventDefault(); undoLastPoint(); }
    });
    window.addEventListener('keyup', e => { if (e.key === 'Shift') isShiftPressed = false; });

    document.getElementById('btnPan').onclick = () => switchTool('pan');
    document.getElementById('btnMeasureArea').onclick = () => switchTool('area');
    document.getElementById('btnMeasureLength').onclick = () => switchTool('length');
    document.getElementById('btnCalibrate').onclick = () => switchTool('calibrate');
    document.getElementById('btnUndo').onclick = undoLastPoint;
    document.getElementById('btnClear').onclick = () => { points = []; finalValueText = ""; document.getElementById('areaResult').innerText = "0"; draw(); };
    document.getElementById('btnZoomIn').onclick = () => { view.zoom *= 1.2; draw(); };
    document.getElementById('btnZoomOut').onclick = () => { view.zoom /= 1.2; draw(); };
    document.getElementById('btnApplyScale').onclick = () => { applyScaleSettings(); draw(); };
    
    document.getElementById('btnSave').onclick = () => {
        try {
            const off = document.createElement('canvas'); off.width = canvas.width; off.height = canvas.height;
            render(off.getContext('2d'), off.width, off.height, true);
            const url = off.toDataURL('image/jpeg', 0.9);
            const link = document.createElement('a'); 
            link.download = 'Measure_Result.jpg'; 
            link.href = url; 
            link.click();
        } catch (e) {
            alert("⚠️ 瀏覽器安全性提示：\n\n系統將切換至「列印模式」，請在接下來的視窗中選擇【另存為 PDF】。");
            window.print();
        }
    };

    function resizeCanvas() { canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight; draw(); }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    wrapper.oncontextmenu = (e) => e.preventDefault();
</script>
</body>
</html>
